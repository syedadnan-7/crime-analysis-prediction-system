                <span class="icon-bar"></span>

      <div class="container">
        <div class="row">
           <div class="row" style="top: 50%;left: 50%;position: absolute;width: 100%;transform: translate(-50%, -50%);">
          <div class="col-md-4"></div>
          <div class="col-md-4" style=" border-radius: 10px; padding:10px; color: white; border: 1px solid white">
            <center><span class="errormessage" style="color: #f7a2a2"></span></center>
            <div id="registerform" style="display: none;">
                  <center><h3 style="color: white">User Registeration</h3></center>
                  <form action="#">
                    <div class="row">
                      <div class="col-md-6">
                            <div class="form-group">
                              <label for="email">Name</label>
                              <input type="email" class="form-control" id="regusername" placeholder="Eg:) Adity Ansari">
                            </div>
                      </div>
                      <div class="col-md-6">
                             <div class="form-group">
                              <label for="email">Email</label>
                              <input type="email" class="form-control" id="regemail" placeholder="Eg:) adityansari@gmail.com">
                            </div>
                      </div>
                    </div>
                    
                    <div class="row">
                      <div class="col-md-6">
                        <div class="form-group">
                          <label for="email">Phone</label>
                          <input type="email" class="form-control" id="regphone" placeholder="Eg:) 9786543512">
                        </div>
                      </div>
                      <div class="col-md-6">
                             <div class="form-group">
                              <label for="pwd">Password</label>
                              <input type="password" class="form-control" id="regpassword" placeholder="Eg:) *******">
                            </div>
                      </div>
                    </div>
                     
                    
                    
                    <div class="row">
                      <div class="col-md-12">
                        <div class="form-group">
                          <label for="email">Using For</label>
                          <input type="email" class="form-control" id="usingfor" placeholder="Eg:) To book my complaint">
                        </div>
                         </div>
                    </div>

                    <div class="row">
                      <div class="col-md-12">
                        <div class="form-group">
                          <label for="">Address</label>
                          <textarea id="regaddress" class="form-control" placeholder="123, GMR streen, Annanagar, Mumbai-73"></textarea>
                        </div>
                         </div>
                    </div>
                    
                    
                    <div class="row">
                       <div class="col-md-3"></div>
                        <div class="col-md-6"><button type="button" id="signupbtn" class="btn btn-success" style="width: 100%">Register</button>
                          <br><br>
                          <center><span id="loglink" style="cursor: pointer;">Already registered?</span></center>
                        </div>
                        <div class="col-md-3"></div>
                    </div>
                  </form>
              </div>

              <div id="logform">
                  <center><h3 style="color: white">User Login</h3></center>
                  <form action="#">
                     <div class="form-group">
                      <label for="email">Phone</label>
                      <input type="email" class="form-control" id="signphone" placeholder="Eg:) 9786543512">
                    </div>
                    <div class="form-group">
                      <label for="pwd">Password</label>
                      <input type="password" class="form-control" id="signpassword" placeholder="Eg:) *******">
                    </div>
                    <div class="row">
                       <div class="col-md-3"></div>
                        <div class="col-md-6"><button type="button" id="signinbtn" class="btn btn-success" style="width: 100%">Login</button>
                          <br><br>
                          <center><span id="reglink" style="cursor: pointer;">New user?</span></center>
                        </div>
                        <div class="col-md-3"></div>
                    </div>
                  </form>
              </div>

            </div>
              <div class="col-md-4"></div>
        </div>
      </div>
    </div>
  </section>

{% include 'footer.html' %}
<script type="text/javascript">
      $(document).ready(function(){
        $("#reglink").click(function(){
          $("#registerform").show();
          $("#logform").hide();
        });

        $("#loglink").click(function(){
          $("#registerform").hide();
          $("#logform").show();
        });

        $("#signinbtn").click(function(){
          var signphone = $("#signphone").val();
          var signpassword = $("#signpassword").val();
          if (signphone == ''){
            message("Enter the phone!")
          }else if(signpassword == ''){
            message("Enter the password!")
          }else{
            $.ajax({
                url:"/login", 
                type: "post", 
                dataType: 'json',
                data: {"signphone":signphone, "signpassword":signpassword},
                  success: function(output){
                    if (output == 0){
                      message('Username and Password does not match!')
                    }if (output == 2){
                      message('You can access the system after the admin approval!')
                    }else if (output == 1){
                      location.href = "{{url_for('userhome')}}"
                    }
                  }
                });
          }
        });

        $("#signupbtn").click(function(){
          var regusername = $("#regusername").val();
          var regphone = $("#regphone").val();
          var regemail = $("#regemail").val();
          var regpassword = $("#regpassword").val();
          var usingfor = $("#usingfor").val();
          var regaddress = $("#regaddress").val();

          if (regusername == ''){
            message("Enter the Username!")
          }else if(regphone == ''){
            message("Enter the Phone!")
          }else if(regemail == ''){
            message("Enter the Email!")
          }else if(regpassword == ''){
            message("Enter the Password!")
          }else{
            $.ajax({
              url:"/register", 
              type: "post", 
              dataType: 'json',
              data: {"regusername":regusername, "regphone":regphone, "regemail":regemail, "regpassword":regpassword, "usingfor":usingfor,"regaddress":regaddress},
                success: function(output){
                  if (output == 0){
                    message('Sorry unable to register')
                  }else if (output == 1){
                    message("Registeration Completed! Login to continue")
                    $("#loglink").click()
                  }else if (output == 2){
                    message("The given details are already registered.")
                    $("#loglink").click()
                  }
                }
              });
          }
        });


        function message(message){
          $(".errormessage").html(message)
          $(".errormessage").show()
          return false
        }
          });
    </script>
